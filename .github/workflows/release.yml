name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

jobs:
  publish:
    # Needs the macOS 26 SDK to compile the Liquid Glass code path (it's
    # gated behind `@available(macOS 26.0, *)` for runtime safety, but the
    # compiler still needs the SDK the symbol was declared in to resolve it
    # at all — an availability guard doesn't help if the symbol doesn't
    # exist in the SDK being compiled against). macos-14 predates macOS 26
    # entirely and is being deprecated; macos-26 ships Xcode 26 with the
    # matching SDK preinstalled.
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Optional: Developer ID signing + notarization. Runs only when the
      # APPLE_* secrets exist; without them the release is built ad-hoc signed
      # exactly as before. Required secrets:
      #   APPLE_CERTIFICATE_P12     base64 of the "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD password of that .p12
      #   APPLE_ID                  Apple ID used for notarytool
      #   APPLE_APP_PASSWORD        app-specific password for that Apple ID
      #   APPLE_TEAM_ID             10-character Developer Team ID
      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE_P12" || -z "$APPLE_ID" ]]; then
            echo "Apple signing secrets not set; building ad-hoc signed." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "No Developer ID Application identity in certificate." >&2; exit 1; }
          xcrun notarytool store-credentials release-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build Apple Silicon release assets
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          if [[ "$SIGNING_ENABLED" == "true" ]]; then
            export CODESIGN_IDENTITY="$SIGNING_IDENTITY"
            export NOTARY_KEYCHAIN_PROFILE=release-notary
          fi
          ./make-release.sh "${TAG_NAME#v}" "$BUILD_NUMBER"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          assets=(
            "AIUsageBar-v${version}-macos-arm64.dmg"
            "AIUsageBar-v${version}-macos-arm64.dmg.sha256"
          )
          notes_file="release-notes.md"

          awk -v heading="## [$version]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "No CHANGELOG.md section found for $version; using fallback release notes." >&2
            printf 'Release %s\n' "$TAG_NAME" > "$notes_file"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$notes_file" \
              --prerelease=false
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --notes-file "$notes_file" \
              --latest
          fi

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY" || {
            echo "Missing SPARKLE_PRIVATE_KEY repository secret." >&2
            exit 1
          }

          version="${TAG_NAME#v}"
          archive="AIUsageBar-v${version}-macos-arm64.dmg"
          site="site"
          feed_url="https://perththeiamcat.github.io/ai-usage-bar/appcast.xml"
          download_prefix="https://github.com/PerthTheIamCat/ai-usage-bar/releases/download/${TAG_NAME}/"

          mkdir -p "$site"
          curl --fail --silent --show-error "$feed_url" -o "$site/appcast.xml" || true
          cp "$archive" "$site/"
          cp release-notes.md "$site/${archive%.dmg}.md"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "$download_prefix" \
              --full-release-notes-url "https://github.com/PerthTheIamCat/ai-usage-bar/releases/tag/${TAG_NAME}" \
              --embed-release-notes \
              --link "https://github.com/PerthTheIamCat/ai-usage-bar" \
              --maximum-versions 1 \
              -o "$site/appcast.xml" \
              "$site"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/sign_update \
              --ed-key-file - \
              --disable-signing-warning \
              "$site/appcast.xml"

          rm "$site/$archive" "$site/${archive%.dmg}.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload update feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy update feed
        id: deployment
        uses: actions/deploy-pages@v4
